name: Android app

# Builds the Android app (app/) and publishes it as the latest GitHub release, which the site's
# "Get the app" button links to. Needs two repository secrets (Settings → Secrets and variables → Actions):
# ANDROID_KEYSTORE_B64 (the signing key, base64) and ANDROID_KEYSTORE_PASSWORD. Every update must be
# signed with the same key, or phones refuse to install it over the old version.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test the background aurora check
        run: node --test app/test/aurora.test.cjs
      - name: Install and sync the Capacitor project
        working-directory: app
        run: npm ci && npx cap sync android
      - name: Signing key from repository secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repository secrets first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build the APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk mirrie-dancers.apk
          gh release create "android-${{ github.run_number }}" mirrie-dancers.apk --latest \
            --title "Mirrie Dancers for Android 1.0.${{ github.run_number }}" \
            --notes "Download **mirrie-dancers.apk** on your Android phone, open it, and allow installing from your browser when asked. Updates install over the old version and keep your settings. Turn on alerts in the app to hear when the northern lights chance near you goes up, even with the app closed."
